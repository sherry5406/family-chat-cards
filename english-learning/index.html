<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>生活英語｜Unit 48–49</title>
<style>
:root{--bg:#f7f4ee;--card:#fffdf8;--ink:#3f3a34;--muted:#8b8176;--accent:#d77b5c;--green:#5d9a91;--line:#e7ddd1}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans TC",sans-serif}.app{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.side{position:sticky;top:0;height:100vh;padding:24px 18px;background:#fffaf3;border-right:1px solid var(--line)}.logo{font-size:21px;font-weight:800;margin-bottom:4px}.sub{font-size:13px;color:var(--muted);margin-bottom:20px}.unit{width:100%;border:0;background:transparent;text-align:left;padding:13px;border-radius:14px;cursor:pointer;margin-bottom:7px}.unit:hover,.unit.active{background:#f1d6c9}.unit b,.unit small{display:block}.unit b{font-size:14px}.unit small{margin-top:3px}.unit .en{color:var(--ink)}.unit .zh{color:var(--muted);font-size:13px}.unit.active .en{color:#7c402f;font-weight:800}.main{max-width:1100px;width:100%;margin:auto;padding:28px 30px 60px}.hero{background:linear-gradient(135deg,#fffaf4,#f3e8dc);border:1px solid var(--line);border-radius:24px;padding:25px 28px;margin-bottom:22px}.heroTop{display:flex;justify-content:space-between;gap:15px}.eyebrow{font-size:13px;color:var(--accent);font-weight:800}.hero h1{font-size:clamp(28px,4vw,42px);margin:6px 0}.hero p{color:var(--muted);margin:0}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#fff;font-weight:750;cursor:pointer}.section{margin-top:22px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sectionTitle h2{font-size:20px;margin:0}.sectionTitle span{font-size:13px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px}.line{display:flex;gap:10px;align-items:flex-start}.play{border:0;width:40px;height:40px;border-radius:50%;background:#f1d6c9;color:#7c402f;cursor:pointer}.sentence{font-size:21px;font-weight:750;line-height:1.5}.zh{font-size:15px;color:var(--muted);margin-top:3px}.words{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px;padding-top:12px;border-top:1px dashed var(--line)}.word{border:1px solid #dfd4c7;background:#fff;padding:7px 10px;border-radius:10px;cursor:pointer}.word:hover{border-color:var(--accent);background:#fff8f3}.word i{display:block;font-size:11px;color:var(--green);font-style:normal;margin-top:2px}.vocab{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}.v{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px}.vtop{display:flex;justify-content:space-between;align-items:center}.vtop button{border:0;background:#edf5f2;color:#39766e;border-radius:9px;padding:6px;cursor:pointer}.ipa{font-size:12px;color:var(--green);margin-top:4px}.meaning{font-size:13px;color:var(--muted);margin-top:3px}.note{margin-top:18px;padding:12px;background:#f8f1e9;border-radius:12px;color:var(--muted);font-size:13px}.mobile{display:none}
.modal{position:fixed;inset:0;background:rgba(35,29,24,.45);display:flex;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.hide{display:none}.box{width:min(520px,100%);background:#fffdf8;border-radius:24px;overflow:hidden;box-shadow:0 20px 60px #0003}.head{padding:20px 22px 16px;background:linear-gradient(135deg,#fff7ef,#f2e5d9);display:flex;justify-content:space-between}.label{font-size:12px;color:var(--accent);font-weight:800}.mword{font-size:36px;font-weight:850}.mmeaning{color:var(--muted);font-size:17px}.close{border:0;border-radius:50%;width:38px;height:38px;cursor:pointer}.body{padding:20px 22px 24px}.mipa{font-size:21px;color:var(--green);margin-bottom:16px}.actions{display:flex;gap:9px;flex-wrap:wrap}.actions button{border:0;border-radius:12px;padding:11px 14px;cursor:pointer;font-weight:750;background:#f1d6c9;color:#7c402f}.actions .green{background:#edf5f2;color:#39766e}.practice{margin-top:18px;padding:16px;border-radius:16px;background:#f8f1e9}.practice h3{margin:0 0 6px}.practice p{font-size:13px;color:var(--muted)}.result{min-height:22px;font-weight:700;margin-top:10px}.example{margin-top:17px;padding-top:15px;border-top:1px dashed var(--line)}.exzh{color:var(--muted);font-size:14px;margin-top:3px}
@media(max-width:850px){.app{display:block}.side{display:none}.main{padding:16px 14px 90px}.grid{grid-template-columns:1fr}.vocab{grid-template-columns:repeat(2,minmax(0,1fr))}.heroTop{display:block}.hero{padding:20px}.hero .btn{margin-top:14px}.mobile{display:flex;position:fixed;z-index:9;left:10px;right:10px;bottom:10px;background:#fffaf3f5;border:1px solid var(--line);border-radius:16px;padding:7px;gap:6px;box-shadow:0 8px 30px #0002}.mobile button{flex:1;border:0;background:transparent;padding:10px;border-radius:11px}.mobile button.active{background:#f1d6c9;color:#7c402f;font-weight:800}}
</style></head>
<body>
<div class="app"><aside class="side"><div class="logo">📚 生活英語</div><div class="sub">句子・單字・KK音標・發音</div><div id="menu"></div></aside>
<main class="main"><section class="hero"><div class="heroTop"><div><div class="eyebrow" id="label"></div><h1 id="title"></h1><p id="subtitle"></p></div><button class="btn" id="all">🔊 播放本單元</button></div></section>
<section class="section"><div class="sectionTitle"><h2>🗣️ 例句</h2><span>點單字開啟單字小卡</span></div><div class="grid" id="sentences"></div></section>
<section class="section"><div class="sectionTitle"><h2>📖 單字</h2><span>播放・KK音標</span></div><div class="vocab" id="vocab"></div></section><div class="note">💡 發音使用瀏覽器內建語音；發音練習會在支援語音辨識的瀏覽器中進行。</div></main></div>
<div class="mobile" id="mobile"></div>
<div class="modal hide" id="modal"><div class="box"><div class="head"><div><div class="label">WORD CARD</div><div class="mword" id="mw"></div><div class="mmeaning" id="mm"></div></div><button class="close" id="close">×</button></div><div class="body"><div class="mipa" id="mi"></div><div class="actions"><button id="mp">🔊 播放發音</button><button class="green" id="ms">🐢 慢速播放</button></div><div class="practice"><h3>🎤 發音練習</h3><p>先聽一次，再跟著念；支援語音辨識時會顯示辨識結果。</p><div class="actions"><button class="green" id="practice">🎙️ 開始練習</button><button class="green" id="stop">⏹ 停止</button></div><div class="result" id="result"></div></div><div class="example" id="example"></div></div></div></div>
<script>
const U={48:{title:'I feel sick.',zh:'我覺得不舒服。',s:[['I feel sick.','我覺得不舒服。'],['Are you OK? Let me see.','你還好嗎？我看看。'],['I feel happy.','我覺得開心。'],['I feel sad.','我覺得難過。'],['I feel depressed.','我覺得沮喪。'],['I feel excited.','我覺得興奮。'],['I feel sleepy.','我覺得想睡覺。'],['You look a bit under the weather.','你看起來有點不舒服。']],v:[['exhausted','疲累的','ɪɡˈzɔstɪd'],['nervous','緊張的','ˈnɝvəs'],['angry','生氣的','ˈæŋɡri'],['bored','覺得無聊的','bɔrd'],['scared','害怕的','skɛrd'],['embarrassed','覺得尷尬的','ɪmˈbærəst'],['confident','有自信的','ˈkɑnfədənt'],['confused','困惑的','kənˈfjuzd'],['happy','開心的','ˈhæpi'],['sad','難過的','sæd'],['depressed','沮喪的','dɪˈprɛst'],['excited','興奮的','ɪkˈsaɪtɪd'],['sleepy','想睡覺的','ˈslipi'],['sick','不舒服的','sɪk']]},49:{title:'I can wash my hair.',zh:'我會自己洗頭髮。',s:[['I can wash my hair.','我會自己洗頭髮。'],['You are great.','你真棒！'],['I can wash my feet.','我會自己洗腳。'],['I can wash my face.','我會自己洗臉。'],['I can wash my neck.','我會自己洗脖子。'],['I can wash my hands.','我會自己洗手。'],['Let me blow-dry your hair.','讓我幫你吹乾頭髮。'],['The water in the bathtub is too hot.','浴缸裡的水太熱了。'],['The water is warm enough.','水溫夠暖和。']],v:[['back','背部','bæk'],['arm','手臂','ɑrm'],['ear','耳朵','ɪr'],['leg','腿','lɛɡ'],['mouth','嘴巴','maʊθ'],['finger','手指','ˈfɪŋɡɚ'],['chest','胸部','tʃɛst'],['tummy','肚子','ˈtʌmi'],['shoulder','肩膀','ˈʃoʊldɚ'],['hair','頭髮','hɛr'],['wash','洗','wɑʃ'],['feet','腳（foot複數）','fit'],['face','臉','feɪs'],['neck','脖子','nɛk'],['hands','手（hand複數）','hændz']]}};
let cur=48,word='',rec=null;const $=x=>document.getElementById(x);function esc(x){return x.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function speak(t,r=.82){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=r;speechSynthesis.speak(u)}
function render(){let u=U[cur];$('label').textContent='UNIT '+cur;$('title').textContent=u.title;$('subtitle').textContent=u.zh;$('sentences').innerHTML=u.s.map(x=>{let ws=x[0].match(/[A-Za-z]+(?:-[A-Za-z]+)*/g)||[];return `<article class="card"><div class="line"><button class="play" data-play="${esc(x[0])}">▶</button><div><div class="sentence">${esc(x[0])}</div><div class="zh">${esc(x[1])}</div></div></div><div class="words">${ws.map(w=>`<button class="word" data-word="${esc(w)}">${esc(w)}<i>${ipa(w)}</i></button>`).join('')}</div></article>`}).join('');$('vocab').innerHTML=u.v.map(x=>`<div class="v"><div class="vtop"><b>${esc(x[0])}</b><button data-play="${esc(x[0])}">🔊</button></div><div class="ipa">/${esc(x[2])}/</div><div class="meaning">${esc(x[1])}</div></div>`).join('');document.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>speak(b.dataset.play));document.querySelectorAll('[data-word]').forEach(b=>b.onclick=()=>openCard(b.dataset.word));document.querySelectorAll('[data-unit]').forEach(b=>b.classList.toggle('active',+b.dataset.unit===cur))}
function ipa(w){let a=U[cur].v.find(x=>x[0].toLowerCase()===w.toLowerCase());return a?a[2]:''}function menu(){let h=Object.keys(U).map(k=>`<button class="unit ${+k===cur?'active':''}" data-unit="${k}"><b>UNIT ${k}</b><small class="en">${esc(U[k].title)}</small><small class="zh">${esc(U[k].zh)}</small></button>`).join('');$('menu').innerHTML=h;$('mobile').innerHTML=Object.keys(U).map(k=>`<button data-unit="${k}">Unit ${k}</button>`).join('');document.querySelectorAll('[data-unit]').forEach(b=>b.onclick=()=>{cur=+b.dataset.unit;menu();render();scrollTo({top:0,behavior:'smooth'})})}
function openCard(w){word=w.toLowerCase();let v=U[cur].v.find(x=>x[0].toLowerCase()===word);$('mw').textContent=word;$('mm').textContent=v?v[1]:'單字';$('mi').textContent=v?'/'+v[2]+'/':'';let ex=U[cur].s.find(x=>new RegExp('\\b'+word.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'\\b','i').test(x[0]));$('example').innerHTML=ex?`<b>📌 例句</b><div>${esc(ex[0])}</div><div class="exzh">${esc(ex[1])}</div>`:'';$('result').textContent='';$('modal').classList.remove('hide');document.body.style.overflow='hidden'}function closeCard(){$('modal').classList.add('hide');document.body.style.overflow='';if(rec){try{rec.stop()}catch(e){}rec=null}}$('close').onclick=closeCard;$('modal').onclick=e=>{if(e.target===$('modal'))closeCard()};$('mp').onclick=()=>speak(word);$('ms').onclick=()=>speak(word,.55);$('stop').onclick=()=>{if(rec)try{rec.stop()}catch(e){}speechSynthesis.cancel();$('result').textContent='已停止練習。'};$('practice').onclick=()=>{let SR=SpeechRecognition||webkitSpeechRecognition;if(!SR){$('result').textContent='目前瀏覽器不支援語音辨識，可以先聽發音再跟讀。';return}rec=new SR();rec.lang='en-US';rec.interimResults=false;rec.onresult=e=>{let h=e.results[0][0].transcript.trim();$('result').textContent=h.toLowerCase().includes(word)?'✅ 很棒！辨識到：'+h:'🔁 辨識到：'+h+'，再試一次看看。'};rec.onerror=()=>{$('result').textContent='⚠️ 無法辨識，請確認麥克風權限後再試一次。'};speak(word,.55);try{rec.start()}catch(e){}};$('all').onclick=()=>{speechSynthesis.cancel();let i=0,a=U[cur].s.map(x=>x[0]);function n(){if(i<a.length){let u=new SpeechSynthesisUtterance(a[i++]);u.lang='en-US';u.rate=.82;u.onend=n;speechSynthesis.speak(u)}}n()};menu();render();
</script></body></html>
