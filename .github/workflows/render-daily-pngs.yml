name: Render daily activity PNGs
on:
  push:
    branches: [main]
    paths:
      - '親子活動/**/*.svg'
jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install renderer
        run: pip install cairosvg
      - name: Render PNGs
        shell: bash
        run: |
          set -e
          for f in $(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" | grep -E '^親子活動/.+/.+\.svg$' || true); do
            png="${f%.svg}.png"
            python -c "import cairosvg; cairosvg.svg2png(url='$f', write_to='$png', output_width=1240, output_height=1754)"
          done
      - name: Commit rendered PNGs
        shell: bash
        run: |
          set -e
          if git diff --quiet -- '*.png'; then
            echo 'No PNG changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '親子活動/**/*.png'
          git commit -m 'chore: render daily activity PNGs'
          git push origin main
