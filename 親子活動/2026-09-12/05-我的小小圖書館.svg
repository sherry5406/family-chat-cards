<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><rect width="794" height="1123" fill="white"/><g font-family="sans-serif" fill="black"><text x="397" y="55" text-anchor="middle" font-size="30" font-weight="bold">5. 我的小小圖書館</text><text x="35" y="100" font-size="17" font-weight="bold">遊戲目的</text><text x="35" y="125" font-size="14">認識書籍分類，練習整理與借還流程。</text><text x="420" y="100" font-size="17" font-weight="bold">材料</text><text x="420" y="125" font-size="14">列印本頁、剪刀、膠帶。</text><text x="35" y="175" font-size="17" font-weight="bold">玩法步驟</text><text x="35" y="202" font-size="14">1. 剪下書封與分類標籤。</text><text x="35" y="227" font-size="14">2. 把書放到故事、動物、知識三區。</text><text x="35" y="252" font-size="14">3. 一人當圖書館員，一人借書。</text><text x="35" y="277" font-size="14">4. 完成借閱卡，再把書歸還。</text><text x="35" y="325" font-size="17" font-weight="bold">7歲孩子負責</text><text x="35" y="350" font-size="14">分類、填借閱卡、介紹書名。</text><text x="420" y="325" font-size="17" font-weight="bold">3歲孩子負責</text><text x="420" y="350" font-size="14">挑書、貼標籤、練習借還。</text><text x="397" y="400" text-anchor="middle" font-size="18" font-weight="bold">可直接剪下：書封與分類標籤</text></g><g stroke="black" fill="white" stroke-width="2"><rect x="55" y="430" width="205" height="150"/><rect x="294" y="430" width="205" height="150"/><rect x="533" y="430" width="205" height="150"/><text x="157" y="465" text-anchor="middle" font-family="sans-serif" font-size="20">故事書</text><text x="396" y="465" text-anchor="middle" font-family="sans-serif" font-size="20">動物書</text><text x="635" y="465" text-anchor="middle" font-family="sans-serif" font-size="20">知識書</text><path d="M75 520h165M314 520h165M553 520h165"/><rect x="55" y="630" width="205" height="90"/><rect x="294" y="630" width="205" height="90"/><rect x="533" y="630" width="205" height="90"/><text x="157" y="685" text-anchor="middle" font-family="sans-serif" font-size="18">借閱卡</text><text x="396" y="685" text-anchor="middle" font-family="sans-serif" font-size="18">姓名：________</text><text x="635" y="685" text-anchor="middle" font-family="sans-serif" font-size="18">書名：________</text><rect x="55" y="770" width="683" height="210" stroke-dasharray="8 6"/><text x="397" y="850" text-anchor="middle" font-family="sans-serif" font-size="24">我的圖書館書架</text><text x="397" y="900" text-anchor="middle" font-family="sans-serif" font-size="18">□ 分類完成　□ 借閱　□ 歸還</text></g></svg>