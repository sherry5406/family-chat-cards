<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><rect width="794" height="1123" fill="white"/><g font-family="sans-serif" fill="black"><text x="397" y="55" text-anchor="middle" font-size="30" font-weight="bold">2. 神秘路標探險家</text><text x="35" y="100" font-size="17" font-weight="bold">遊戲目的</text><text x="35" y="125" font-size="14">認識方向詞，練習聽指令與合作。</text><text x="420" y="100" font-size="17" font-weight="bold">材料</text><text x="420" y="125" font-size="14">列印本頁、剪刀、小玩具。</text><text x="35" y="175" font-size="17" font-weight="bold">玩法步驟</text><text x="35" y="202" font-size="14">1. 剪下下方路標卡。  2. 在地上排出路線。</text><text x="35" y="227" font-size="14">3. 7歲說方向，3歲依指令移動小玩具。</text><text x="35" y="252" font-size="14">4. 完成後交換角色，再挑戰一次。</text><text x="35" y="305" font-size="17" font-weight="bold">7歲孩子負責</text><text x="35" y="330" font-size="14">設計路線、發指令、增加轉彎。</text><text x="420" y="305" font-size="17" font-weight="bold">3歲孩子負責</text><text x="420" y="330" font-size="14">聽指令、拿路標、移動玩具。</text><text x="397" y="380" text-anchor="middle" font-size="18" font-weight="bold">可直接剪下使用的路標卡</text></g><g stroke="black" fill="white" stroke-width="3"><rect x="55" y="415" width="200" height="90"/><rect x="297" y="415" width="200" height="90"/><rect x="539" y="415" width="200" height="90"/><rect x="55" y="535" width="200" height="90"/><rect x="297" y="535" width="200" height="90"/><text x="155" y="472" text-anchor="middle" font-family="sans-serif" font-size="28">左轉</text><text x="397" y="472" text-anchor="middle" font-family="sans-serif" font-size="28">右轉</text><text x="639" y="472" text-anchor="middle" font-family="sans-serif" font-size="28">直走</text><text x="155" y="592" text-anchor="middle" font-family="sans-serif" font-size="28">停下</text><text x="397" y="592" text-anchor="middle" font-family="sans-serif" font-size="28">回頭</text><rect x="55" y="680" width="684" height="300"/><circle cx="110" cy="830" r="20"/><circle cx="684" cy="830" r="20"/><path d="M110 830h150v-90h170v150h150v-60h104" stroke-dasharray="12 10"/></g><text x="397" y="1030" text-anchor="middle" font-family="sans-serif" font-size="18">起點 ●　　　　　　　　　　　　　● 終點</text></svg>