<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><rect width="794" height="1123" fill="white"/><g font-family="sans-serif" fill="black"><text x="397" y="55" text-anchor="middle" font-size="30" font-weight="bold">4. 小小修理工配對工具</text><text x="35" y="100" font-size="17" font-weight="bold">遊戲目的</text><text x="35" y="125" font-size="14">認識工具用途，練習配對與表達。</text><text x="420" y="100" font-size="17" font-weight="bold">材料</text><text x="420" y="125" font-size="14">列印本頁、剪刀、膠帶。</text><text x="35" y="175" font-size="17" font-weight="bold">玩法步驟</text><text x="35" y="202" font-size="14">1. 剪下工具卡與工作卡。</text><text x="35" y="227" font-size="14">2. 想想每個工具可以做什麼。</text><text x="35" y="252" font-size="14">3. 把工具卡放到正確工作旁。</text><text x="35" y="277" font-size="14">4. 用紙做一個假修理站玩角色遊戲。</text><text x="35" y="325" font-size="17" font-weight="bold">7歲孩子負責</text><text x="35" y="350" font-size="14">閱讀用途、配對、說明理由。</text><text x="420" y="325" font-size="17" font-weight="bold">3歲孩子負責</text><text x="420" y="350" font-size="14">拿工具卡、找圖片、一起說名稱。</text><text x="397" y="400" text-anchor="middle" font-size="18" font-weight="bold">剪下配對卡</text></g><g stroke="black" fill="white" stroke-width="2"><rect x="55" y="430" width="200" height="85"/><rect x="297" y="430" width="200" height="85"/><rect x="539" y="430" width="200" height="85"/><text x="155" y="482" text-anchor="middle" font-family="sans-serif" font-size="24">尺</text><text x="397" y="482" text-anchor="middle" font-family="sans-serif" font-size="24">刷子</text><text x="639" y="482" text-anchor="middle" font-family="sans-serif" font-size="24">膠帶</text><rect x="55" y="555" width="200" height="85"/><rect x="297" y="555" width="200" height="85"/><rect x="539" y="555" width="200" height="85"/><text x="155" y="607" text-anchor="middle" font-family="sans-serif" font-size="24">量一量</text><text x="397" y="607" text-anchor="middle" font-family="sans-serif" font-size="24">刷一刷</text><text x="639" y="607" text-anchor="middle" font-family="sans-serif" font-size="24">貼一貼</text><rect x="55" y="720" width="684" height="260" stroke-dasharray="8 6"/><text x="397" y="850" text-anchor="middle" font-family="sans-serif" font-size="24">我的假修理站</text><text x="397" y="900" text-anchor="middle" font-family="sans-serif" font-size="18">□ 工具　□ 工作　□ 配對完成</text></g></svg>