<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="sans-serif" fill="black"><text x="397" y="55" text-anchor="middle" font-size="30" font-weight="bold">1. 小小拼圖修理站</text><text x="35" y="95" font-size="16" font-weight="bold">遊戲目的</text><text x="35" y="120" font-size="14">練習觀察、拼圖、合作與問題解決。</text><text x="420" y="95" font-size="16" font-weight="bold">材料</text><text x="420" y="120" font-size="14">列印本頁、剪刀、膠帶或膠水。</text><text x="35" y="165" font-size="16" font-weight="bold">玩法步驟</text><text x="35" y="192" font-size="14">1. 剪下下方拼圖片。</text><text x="35" y="217" font-size="14">2. 一起找出邊角與相鄰圖案。</text><text x="35" y="242" font-size="14">3. 拼回完整圖片，發現缺口就修補。</text><text x="35" y="267" font-size="14">4. 哥哥挑戰計時，弟弟找相同圖案。</text><text x="35" y="315" font-size="16" font-weight="bold">7歲孩子負責</text><text x="35" y="340" font-size="14">觀察線索、規劃拼法、檢查是否完整。</text><text x="420" y="315" font-size="16" font-weight="bold">3歲孩子負責</text><text x="420" y="340" font-size="14">找圖片、放拼片、幫忙貼好。</text><text x="397" y="385" text-anchor="middle" font-size="18" font-weight="bold">可直接使用：剪下拼圖再重新組合</text></g><g stroke="black" fill="none" stroke-width="2"><rect x="55" y="415" width="220" height="220"/><rect x="285" y="415" width="220" height="220"/><rect x="515" y="415" width="220" height="220"/><path d="M55 525h680M165 415v220M395 415v220M625 415v220" stroke-dasharray="7 6"/><circle cx="165" cy="470" r="35"/><rect x="330" y="450" width="80" height="55"/><path d="M550 535l55-75 55 75z"/><rect x="80" y="680" width="635" height="300"/><path d="M80 780h635M80 880h635M238 680v300M397 680v300M556 680v300" stroke-dasharray="8 6"/><text x="397" y="1020" text-anchor="middle" font-family="sans-serif" font-size="18">拼圖修理檢查：□ 找到邊角　□ 拼好圖案　□ 一起完成</text></g></svg>