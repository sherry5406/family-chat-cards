<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><rect width="794" height="1123" fill="white"/><g font-family="sans-serif" fill="black"><text x="397" y="55" text-anchor="middle" font-size="30" font-weight="bold">6. 紙巾彩虹橋</text><text x="35" y="100" font-size="17" font-weight="bold">遊戲目的</text><text x="35" y="125" font-size="14">認識簡單工程概念，練習設計、測試與改良。</text><text x="420" y="100" font-size="17" font-weight="bold">材料</text><text x="420" y="125" font-size="14">紙巾或紙條、兩本書、棉球或紙球。</text><text x="35" y="175" font-size="17" font-weight="bold">玩法步驟</text><text x="35" y="202" font-size="14">1. 兩本書留出小空間當橋墩。</text><text x="35" y="227" font-size="14">2. 折疊紙條做成橋面。</text><text x="35" y="252" font-size="14">3. 放上輕輕的棉球或紙球測試。</text><text x="35" y="277" font-size="14">4. 如果變形，就重新設計再測試。</text><text x="35" y="325" font-size="17" font-weight="bold">7歲孩子負責</text><text x="35" y="350" font-size="14">畫藍圖、設計折法、記錄測試結果。</text><text x="420" y="325" font-size="17" font-weight="bold">3歲孩子負責</text><text x="420" y="350" font-size="14">遞紙、放棉球、觀察橋有沒有成功。</text><text x="397" y="400" text-anchor="middle" font-size="18" font-weight="bold">橋梁藍圖與測試記錄</text></g><g stroke="black" fill="white" stroke-width="3"><rect x="55" y="430" width="684" height="230"/><line x1="90" y1="610" x2="260" y2="610"/><line x1="534" y1="610" x2="704" y2="610"/><path d="M260 610L397 500L534 610" stroke-dasharray="10 8"/><circle cx="397" cy="500" r="18"/><text x="397" y="690" text-anchor="middle" font-family="sans-serif" font-size="18">我的橋：__________________</text><rect x="55" y="735" width="684" height="245" stroke-dasharray="8 6"/><text x="80" y="780" font-family="sans-serif" font-size="18">測試 1：□ 成功　□ 改良</text><text x="80" y="835" font-family="sans-serif" font-size="18">測試 2：□ 成功　□ 改良</text><text x="80" y="890" font-family="sans-serif" font-size="18">我發現：____________________________</text><text x="80" y="930" font-family="sans-serif" font-size="18">下一次要改：________________________</text></g></svg>