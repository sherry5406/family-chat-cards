<svg xmlns="http://www.w3.org/2000/svg" width="794" height="1123"><rect width="794" height="1123" fill="white"/><g font-family="sans-serif" fill="black"><text x="397" y="55" text-anchor="middle" font-size="30" font-weight="bold">3. 紙筒望遠鏡觀察員</text><text x="35" y="100" font-size="17" font-weight="bold">遊戲目的</text><text x="35" y="125" font-size="14">練習觀察與描述細節。</text><text x="420" y="100" font-size="17" font-weight="bold">材料</text><text x="420" y="125" font-size="14">紙筒、膠帶、列印觀察表、筆。</text><text x="35" y="175" font-size="17" font-weight="bold">玩法步驟</text><text x="35" y="202" font-size="14">1. 用紙筒做簡單望遠鏡外型。</text><text x="35" y="227" font-size="14">2. 找房間或戶外的指定物品。</text><text x="35" y="252" font-size="14">3. 找到後在觀察表打勾並畫下來。</text><text x="35" y="277" font-size="14">4. 絕對不要用望遠鏡看太陽。</text><text x="35" y="325" font-size="17" font-weight="bold">7歲孩子負責</text><text x="35" y="350" font-size="14">讀線索、記錄特徵、帶著弟弟找目標。</text><text x="420" y="325" font-size="17" font-weight="bold">3歲孩子負責</text><text x="420" y="350" font-size="14">拿紙筒觀察、指出找到的物品、畫圖。</text><text x="397" y="400" text-anchor="middle" font-size="18" font-weight="bold">觀察清單</text></g><g stroke="black" fill="white" stroke-width="3"><rect x="70" y="430" width="300" height="70"/><rect x="70" y="520" width="300" height="70"/><rect x="70" y="610" width="300" height="70"/><rect x="424" y="430" width="300" height="250"/><circle cx="574" cy="555" r="80"/><circle cx="574" cy="555" r="55"/><text x="95" y="475" font-family="sans-serif" font-size="20">□ 找到圓形物品</text><text x="95" y="565" font-family="sans-serif" font-size="20">□ 找到柔軟物品</text><text x="95" y="655" font-family="sans-serif" font-size="20">□ 找到有條紋的物品</text><text x="397" y="760" text-anchor="middle" font-family="sans-serif" font-size="18">我看到：________________________</text><rect x="70" y="800" width="654" height="220" stroke-dasharray="8 6"/></g></svg>