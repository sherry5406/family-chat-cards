<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754"><rect width="100%" height="100%" fill="white"/><text x="70" y="90" font-size="48" font-weight="bold">02 顏色怪獸配對</text><text x="70" y="160" font-size="28">遊戲目的：顏色辨識、手眼協調</text><text x="70" y="215" font-size="25">材料：列印本、剪刀、蠟筆</text><text x="70" y="290" font-size="28" font-weight="bold">玩法</text><text x="90" y="340" font-size="24">1 剪下色卡　2 找相同顏色　3 放入怪獸肚子　4 設計新怪獸</text><text x="70" y="420" font-size="27" font-weight="bold">7歲：讀顏色、檢查、出題　　3歲：找色、放卡、說顏色</text><text x="70" y="500" font-size="28" font-weight="bold">紙本素材</text><circle cx="280" cy="700" r="120" fill="none" stroke="black" stroke-width="5"/><circle cx="600" cy="700" r="120" fill="none" stroke="black" stroke-width="5"/><circle cx="920" cy="700" r="120" fill="none" stroke="black" stroke-width="5"/><circle cx="245" cy="665" r="12"/><circle cx="315" cy="665" r="12"/><circle cx="565" cy="665" r="12"/><circle cx="635" cy="665" r="12"/><circle cx="885" cy="665" r="12"/><circle cx="955" cy="665" r="12"/><rect x="150" y="900" width="180" height="100" fill="none" stroke="black" stroke-dasharray="8 8"/><rect x="450" y="900" width="180" height="100" fill="none" stroke="black" stroke-dasharray="8 8"/><rect x="750" y="900" width="180" height="100" fill="none" stroke="black" stroke-dasharray="8 8"/><text x="70" y="1120" font-size="28">我的怪獸名字：____________________________</text></svg>