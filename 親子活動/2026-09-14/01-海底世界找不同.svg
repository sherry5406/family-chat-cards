<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><rect x="35" y="35" width="1170" height="1680" rx="20" fill="none" stroke="black" stroke-width="4"/><text x="100" y="100" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="48" style="font-weight:bold">1. 海底世界找不同</text><text x="100" y="155" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="28" style="font-weight:bold">遊戲目的</text><text x="360" y="155" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="26">觀察力＋專注力</text><text x="100" y="210" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="28" style="font-weight:bold">材料</text><text x="360" y="210" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="25">列印本頁、鉛筆、蠟筆</text><text x="100" y="275" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="30" style="font-weight:bold">玩法步驟</text><text x="120" y="325" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="25">1. 先看上方兩張海底圖。</text><text x="120" y="373" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="25">2. 找出不同的地方並圈起來。</text><text x="120" y="421" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="25">3. 哥哥記錄找到幾處。</text><text x="120" y="469" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="25">4. 交換角色再挑戰一次。</text><text x="100" y="535" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="28" style="font-weight:bold">7歲孩子負責</text><text x="120" y="580" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="24">找線索、記錄數量、說明理由</text><text x="100" y="650" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="28" style="font-weight:bold">3歲孩子負責</text><text x="120" y="695" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="24">圈出看到的不同、說出魚/水母等名稱</text><text x="100" y="780" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="30" style="font-weight:bold">紙本素材｜直接操作</text><rect x="100" y="820" width="560" height="280" fill="none" stroke="black" stroke-width="4"/><rect x="680" y="820" width="560" height="280" fill="none" stroke="black" stroke-width="4"/><circle cx="220" cy="930" r="35" fill="none" stroke="black" stroke-width="4"/><path d="M350 980 Q400 880 460 980 Q530 880 600 980 M170 1050 Q240 990 310 1050 M450 1050 Q530 990 620 1050" fill="none" stroke="black" stroke-width="4"/><circle cx="800" cy="930" r="35" fill="none" stroke="black" stroke-width="4"/><path d="M930 980 Q980 880 1040 980 Q1110 880 1180 980 M750 1050 Q820 990 890 1050 M1030 1050 Q1110 990 1190 1050" fill="none" stroke="black" stroke-width="4"/><text x="100" y="1320" font-family="Noto Sans CJK TC, Noto Sans, sans-serif" font-size="27" style="font-weight:bold">請在下方畫出你發現的一個不同：</text><line x1="100" y1="1390" x2="1140" y2="1390" stroke="black" stroke-width="3"/><line x1="100" y1="1460" x2="1140" y2="1460" stroke="black" stroke-width="3"/></svg>