<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754"><rect width="100%" height="100%" fill="white"/><text x="70" y="90" font-size="48" font-weight="bold">04 水果冰棒創意貼</text><text x="70" y="160" font-size="28">遊戲目的：創造力、精細動作</text><text x="70" y="215" font-size="25">材料：列印本、剪刀、膠水、蠟筆</text><text x="70" y="290" font-size="28" font-weight="bold">玩法</text><text x="90" y="340" font-size="24">1 剪水果卡　2 選水果　3 貼到冰棒　4 取一個名字</text><text x="70" y="420" font-size="27" font-weight="bold">7歲：設計組合、取名　　3歲：選水果、貼上、塗色</text><text x="70" y="500" font-size="28" font-weight="bold">紙本素材</text><rect x="300" y="600" width="400" height="650" rx="170" fill="none" stroke="black" stroke-width="5"/><line x1="430" y1="1250" x2="570" y2="1250" stroke="black" stroke-width="10"/><rect x="850" y="620" width="150" height="100" fill="none" stroke="black" stroke-dasharray="8 8"/><rect x="850" y="760" width="150" height="100" fill="none" stroke="black" stroke-dasharray="8 8"/><rect x="850" y="900" width="150" height="100" fill="none" stroke="black" stroke-dasharray="8 8"/><text x="70" y="1370" font-size="28">我的冰棒名字：________________________</text></svg>