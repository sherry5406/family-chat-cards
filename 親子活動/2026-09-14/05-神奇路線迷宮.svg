<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754"><rect width="100%" height="100%" fill="white"/><text x="70" y="90" font-size="48">05 路線迷宮</text><text x="70" y="160" font-size="28">遊戲目的：方向感、問題解決</text><text x="70" y="215" font-size="25">材料：列印本、鉛筆</text><text x="70" y="290" font-size="28">玩法：1起點 2沿通道 3遇岔路思考 4到終點</text><text x="70" y="360" font-size="27">7歲：找路、計時、出題　3歲：手指走路、圈終點</text><rect x="140" y="500" width="960" height="600" fill="none" stroke="black" stroke-width="5"/><path d="M180 580H450V950H680V680H850V1020H1050" fill="none" stroke="black" stroke-width="50" stroke-linecap="round"/><text x="70" y="1180" font-size="28">紙本素材：從起點走到終點，再畫一條新路。</text></svg>