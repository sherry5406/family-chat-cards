<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Noto Sans CJK TC, Noto Sans, sans-serif" fill="black"><text x="397" y="58" text-anchor="middle" font-size="30" font-weight="700">動物住哪裡配對遊戲</text><rect x="30" y="80" width="734" height="120" fill="none" stroke="black" stroke-width="2"/><text x="45" y="110" font-size="20" font-weight="700">遊戲目的</text><text x="45" y="140" font-size="16">認識動物與棲地，提升觀察與分類能力</text><text x="45" y="170" font-size="20" font-weight="700">材料</text><text x="45" y="195" font-size="15">列印本頁、剪刀、膠帶或膠水</text><text x="45" y="235" font-size="20" font-weight="700">玩法步驟</text><text x="55" y="268" font-size="16">1. 剪下下方的動物與棲地圖卡</text><text x="55" y="298" font-size="16">2. 觀察動物特徵</text><text x="55" y="328" font-size="16">3. 貼到森林、海洋、草原或極地</text><text x="55" y="358" font-size="16">4. 一起說說為什麼這樣配對</text><rect x="30" y="380" width="734" height="145" fill="none" stroke="black"/><text x="45" y="410" font-size="20" font-weight="700">7歲孩子負責</text><text x="45" y="442" font-size="15">分析特徵、檢查答案、說明理由</text><text x="45" y="480" font-size="20" font-weight="700">3歲孩子負責</text><text x="45" y="512" font-size="15">指出動物、剪下圖卡、貼到喜歡的場景</text><text x="45" y="560" font-size="20" font-weight="700">直接操作的紙本素材</text><rect x="45" y="580" width="704" height="500" fill="none" stroke="black"/><text x="140" y="625" text-anchor="middle" font-size="18">森林</text><text x="320" y="625" text-anchor="middle" font-size="18">海洋</text><text x="500" y="625" text-anchor="middle" font-size="18">草原</text><text x="680" y="625" text-anchor="middle" font-size="18">極地</text><g font-size="17" text-anchor="middle"> <rect x="75" y="645" width="130" height="65" fill="none" stroke="black"/><rect x="255" y="645" width="130" height="65" fill="none" stroke="black"/><rect x="435" y="645" width="130" height="65" fill="none" stroke="black"/><rect x="615" y="645" width="110" height="65" fill="none" stroke="black"/><text x="140" y="685">森林</text><text x="320" y="685">海洋</text><text x="500" y="685">草原</text><text x="670" y="685">極地</text></g><g font-size="18" text-anchor="middle"><rect x="75" y="735" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><rect x="235" y="735" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><rect x="395" y="735" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><rect x="555" y="735" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><text x="145" y="775">大象</text><text x="305" y="775">鯨魚</text><text x="465" y="775">獅子</text><text x="625" y="775">企鵝</text><rect x="75" y="825" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><rect x="235" y="825" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><rect x="395" y="825" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><rect x="555" y="825" width="140" height="65" fill="none" stroke="black" stroke-dasharray="6 4"/><text x="145" y="865">魚</text><text x="305" y="865">長頸鹿</text><text x="465" y="865">兔子</text><text x="625" y="865">北極熊</text></g></g></svg>