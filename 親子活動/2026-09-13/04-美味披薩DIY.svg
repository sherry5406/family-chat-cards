<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif" fill="black"><text x="397" y="58" text-anchor="middle" font-size="30" font-weight="700">美味披薩DIY</text><rect x="30" y="80" width="734" height="120" fill="none" stroke="black"/><text x="45" y="110" font-size="20" font-weight="700">遊戲目的</text><text x="45" y="140" font-size="16">認識食材分類、培養創造力與手眼協調</text><text x="45" y="170" font-size="20" font-weight="700">材料</text><text x="45" y="195" font-size="15">列印本頁、剪刀、膠水、彩色筆</text><text x="45" y="235" font-size="20" font-weight="700">玩法步驟</text><text x="55" y="268" font-size="16">1. 剪下下方食材卡</text><text x="55" y="298" font-size="16">2. 選喜歡的配料</text><text x="55" y="328" font-size="16">3. 貼在披薩上並加上顏色</text><text x="55" y="358" font-size="16">4. 介紹自己的披薩口味</text><rect x="30" y="380" width="734" height="145" fill="none" stroke="black"/><text x="45" y="410" font-size="20" font-weight="700">7歲孩子負責</text><text x="45" y="442" font-size="15">設計口味、分類配料、介紹作品</text><text x="45" y="480" font-size="20" font-weight="700">3歲孩子負責</text><text x="45" y="512" font-size="15">選食材、貼上、幫披薩上色</text><text x="45" y="560" font-size="20" font-weight="700">直接操作的紙本素材</text><circle cx="397" cy="770" r="150" fill="none" stroke="black" stroke-width="3"/><g font-size="18" text-anchor="middle"><text x="100" y="990">番茄</text><text x="210" y="990">玉米</text><text x="320" y="990">蘑菇</text><text x="430" y="990">起司</text><text x="540" y="990">青椒</text><text x="650" y="990">香腸</text></g><g stroke="black" stroke-dasharray="6 4" fill="none"><rect x="55" y="930" width="90" height="80"/><rect x="165" y="930" width="90" height="80"/><rect x="275" y="930" width="90" height="80"/><rect x="385" y="930" width="90" height="80"/><rect x="495" y="930" width="90" height="80"/><rect x="605" y="930" width="90" height="80"/></g></g></svg>