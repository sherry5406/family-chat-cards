<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif" fill="black"><text x="397" y="58" text-anchor="middle" font-size="30" font-weight="700">創意表情貼貼樂</text><rect x="30" y="80" width="734" height="120" fill="none" stroke="black"/><text x="45" y="110" font-size="20" font-weight="700">遊戲目的</text><text x="45" y="140" font-size="16">認識不同情緒並練習表達自己的感受</text><text x="45" y="170" font-size="20" font-weight="700">材料</text><text x="45" y="195" font-size="15">列印本頁、剪刀、膠水或膠帶、彩筆</text><text x="45" y="235" font-size="20" font-weight="700">玩法步驟</text><text x="55" y="268" font-size="16">1. 剪下眼睛、嘴巴等素材</text><text x="55" y="298" font-size="16">2. 組合一張表情</text><text x="55" y="328" font-size="16">3. 說出這個表情代表的感覺</text><text x="55" y="358" font-size="16">4. 畫一個自己的表情</text><rect x="30" y="380" width="734" height="145" fill="none" stroke="black"/><text x="45" y="410" font-size="20" font-weight="700">7歲孩子負責</text><text x="45" y="442" font-size="15">設計表情、命名情緒、分享情境</text><text x="45" y="480" font-size="20" font-weight="700">3歲孩子負責</text><text x="45" y="512" font-size="15">選五官、貼上、模仿表情</text><text x="45" y="560" font-size="20" font-weight="700">直接操作的紙本素材</text><rect x="45" y="580" width="704" height="500" fill="none" stroke="black"/><g stroke="black" fill="none"><circle cx="170" cy="730" r="70"/><circle cx="397" cy="730" r="70"/><circle cx="624" cy="730" r="70"/></g><g font-size="18" text-anchor="middle"><text x="170" y="835">開心</text><text x="397" y="835">難過</text><text x="624" y="835">驚訝</text><text x="170" y="1010">生氣</text><text x="397" y="1010">害羞</text><text x="624" y="1010">自訂</text></g></g></svg>