<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif" fill="black"><text x="397" y="58" text-anchor="middle" font-size="30" font-weight="700">一起來種小植物</text><rect x="30" y="80" width="734" height="120" fill="none" stroke="black"/><text x="45" y="110" font-size="20" font-weight="700">遊戲目的</text><text x="45" y="140" font-size="16">觀察植物成長、建立照顧習慣與自然科學興趣</text><text x="45" y="170" font-size="20" font-weight="700">材料</text><text x="45" y="195" font-size="15">列印本頁、小盆栽或杯子、土、綠豆或種子、水、彩筆</text><text x="45" y="235" font-size="20" font-weight="700">玩法步驟</text><text x="55" y="268" font-size="16">1. 準備容器並放入土</text><text x="55" y="298" font-size="16">2. 種下種子並澆少量水</text><text x="55" y="328" font-size="16">3. 每天觀察並在紀錄卡畫下變化</text><text x="55" y="358" font-size="16">4. 每隔幾天比較一次高度與樣子</text><rect x="30" y="380" width="734" height="145" fill="none" stroke="black"/><text x="45" y="410" font-size="20" font-weight="700">7歲孩子負責</text><text x="45" y="442" font-size="15">記錄日期、量高度、描述變化</text><text x="45" y="480" font-size="20" font-weight="700">3歲孩子負責</text><text x="45" y="512" font-size="15">放種子、澆水、畫出看到的樣子</text><text x="45" y="560" font-size="20" font-weight="700">直接操作的紙本素材</text><rect x="45" y="580" width="704" height="500" fill="none" stroke="black"/><g stroke="black" fill="none"><rect x="65" y="640" width="150" height="330"/><rect x="235" y="640" width="150" height="330"/><rect x="405" y="640" width="150" height="330"/><rect x="575" y="640" width="150" height="330"/></g><g font-size="18" text-anchor="middle"><text x="140" y="675">第1天</text><text x="310" y="675">第3天</text><text x="480" y="675">第5天</text><text x="650" y="675">第7天</text><text x="140" y="900">我發現：</text><text x="310" y="900">我發現：</text><text x="480" y="900">我發現：</text><text x="650" y="900">我發現：</text></g></g></svg>