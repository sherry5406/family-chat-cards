<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif" fill="black"><text x="397" y="58" text-anchor="middle" font-size="30" font-weight="700">形狀創意拼圖</text><rect x="30" y="80" width="734" height="120" fill="none" stroke="black"/><text x="45" y="110" font-size="20" font-weight="700">遊戲目的</text><text x="45" y="140" font-size="16">認識基本形狀、培養空間概念與專注力</text><text x="45" y="170" font-size="20" font-weight="700">材料</text><text x="45" y="195" font-size="15">列印本頁、剪刀、膠水、彩筆</text><text x="45" y="235" font-size="20" font-weight="700">玩法步驟</text><text x="55" y="268" font-size="16">1. 剪下圓形、方形、三角形等卡片</text><text x="55" y="298" font-size="16">2. 想一個主題並組合形狀</text><text x="55" y="328" font-size="16">3. 貼到創作框並加細節</text><text x="55" y="358" font-size="16">4. 互相介紹自己的作品</text><rect x="30" y="380" width="734" height="145" fill="none" stroke="black"/><text x="45" y="410" font-size="20" font-weight="700">7歲孩子負責</text><text x="45" y="442" font-size="15">規劃組合、挑戰指定主題、加細節</text><text x="45" y="480" font-size="20" font-weight="700">3歲孩子負責</text><text x="45" y="512" font-size="15">挑形狀、貼上、塗色</text><text x="45" y="560" font-size="20" font-weight="700">直接操作的紙本素材</text><rect x="45" y="580" width="704" height="500" fill="none" stroke="black"/><g font-size="18" text-anchor="middle"><text x="140" y="640">圓形</text><text x="300" y="640">正方形</text><text x="460" y="640">三角形</text><text x="620" y="640">星形</text><text x="140" y="830">愛心</text><text x="300" y="830">長方形</text><text x="460" y="830">橢圓</text><text x="620" y="830">梯形</text></g><g stroke="black" fill="none" stroke-dasharray="6 4"><circle cx="140" cy="720" r="50"/><rect x="250" y="670" width="100" height="100"/><path d="M460 670 L410 770 L510 770 Z"/><path d="M620 670 l15 35 38 3 -29 25 9 37 -33 -20 -33 20 9 -37 -29 -25 38 -3 z"/><path d="M140 850 c-55 -45 -80 30 0 90 80 -60 55 -135 0 -90z"/><rect x="245" y="850" width="110" height="75"/><ellipse cx="460" cy="885" rx="65" ry="40"/><path d="M560 925 l30 -75 60 0 30 75z"/></g></g></svg>