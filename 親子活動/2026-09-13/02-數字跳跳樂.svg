<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><g font-family="Noto Sans CJK TC,sans-serif" fill="black"><text x="397" y="58" text-anchor="middle" font-size="30" font-weight="700">數字跳跳樂</text><rect x="30" y="80" width="734" height="120" fill="none" stroke="black"/><text x="45" y="110" font-size="20" font-weight="700">遊戲目的</text><text x="45" y="140" font-size="16">認識數字順序、練習大肌肉動作與專注力</text><text x="45" y="170" font-size="20" font-weight="700">材料</text><text x="45" y="195" font-size="15">列印本頁、剪刀、膠帶</text><text x="45" y="235" font-size="20" font-weight="700">玩法步驟</text><text x="55" y="268" font-size="16">1. 剪下1～10數字卡</text><text x="55" y="298" font-size="16">2. 排在地上並固定</text><text x="55" y="328" font-size="16">3. 輪流跳到指定數字</text><text x="55" y="358" font-size="16">4. 哥哥出題、弟弟挑戰</text><rect x="30" y="380" width="734" height="145" fill="none" stroke="black"/><text x="45" y="410" font-size="20" font-weight="700">7歲孩子負責</text><text x="45" y="442" font-size="15">安排順序、出題、設計不同跳法</text><text x="45" y="480" font-size="20" font-weight="700">3歲孩子負責</text><text x="45" y="512" font-size="15">跟著數字跳、說數字、幫忙貼卡</text><text x="45" y="560" font-size="20" font-weight="700">直接操作的紙本素材</text><rect x="45" y="580" width="704" height="500" fill="none" stroke="black"/><g font-size="42" text-anchor="middle"> <text x="110" y="680">1</text><text x="250" y="680">2</text><text x="390" y="680">3</text><text x="530" y="680">4</text><text x="670" y="680">5</text><text x="110" y="830">6</text><text x="250" y="830">7</text><text x="390" y="830">8</text><text x="530" y="830">9</text><text x="670" y="830">10</text></g><g stroke="black" stroke-dasharray="6 4" fill="none"><rect x="70" y="620" width="80" height="90"/><rect x="210" y="620" width="80" height="90"/><rect x="350" y="620" width="80" height="90"/><rect x="490" y="620" width="80" height="90"/><rect x="630" y="620" width="80" height="90"/><rect x="70" y="770" width=