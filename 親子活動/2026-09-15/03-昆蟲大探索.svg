<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">03-昆蟲大探索</text><text x="70" y="160" font-size="30">遊戲目的</text><text x="70" y="210" font-size="24">觀察細節、數數與自然探索</text><text x="650" y="160" font-size="30">材料</text><text x="650" y="210" font-size="24">列印本頁、筆、可選放大鏡</text><text x="70" y="300" font-size="30">玩法步驟</text><text x="70" y="350" font-size="24">1. 觀察花園圖片。</text><text x="70" y="395" font-size="24">2. 找出指定昆蟲。</text><text x="70" y="440" font-size="24">3. 數一數每種有幾隻。</text><text x="70" y="485" font-size="24">4. 畫一隻自己想像的昆蟲。</text><text x="70" y="590" font-size="28">7歲：找昆蟲、記錄數量、畫細節</text><text x="650" y="590" font-size="28">3歲：找昆蟲、指出名稱、一起數數</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">可直接列印使用的紙本素材</text><rect x="100" y="790" width="1000" height="500" fill="none" stroke="black" stroke-width="3"/><text x="150" y="900" font-size="32">花朵　蜜蜂　蝴蝶　瓢蟲　螞蟻　蝸牛</text><text x="150" y="1000" font-size="30">我找到：________　數量：________</text><text x="150" y="1200" font-size="30">我的昆蟲：____________________________</text><circle cx="1180" cy="1685" r="6" fill="black"/></svg>