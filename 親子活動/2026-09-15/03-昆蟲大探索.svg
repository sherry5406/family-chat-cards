<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">03 Nature Explorer</text><text x="70" y="160" font-size="30">Purpose</text><text x="70" y="210" font-size="24">Observe details, count, and explore nature.</text><text x="650" y="160" font-size="30">Materials</text><text x="650" y="210" font-size="24">Printed page and pencil.</text><text x="70" y="300" font-size="30">Steps</text><text x="70" y="350" font-size="24">1. Look at the garden picture.</text><text x="70" y="395" font-size="24">2. Find the listed small creatures.</text><text x="70" y="440" font-size="24">3. Count each kind.</text><text x="70" y="485" font-size="24">4. Draw one creature.</text><text x="70" y="590" font-size="28">Age 7: find, count, record, draw details.</text><text x="650" y="590" font-size="28">Age 3: find, name, and count together.</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">Printable activity area</text><rect x="100" y="790" width="1000" height="500" fill="none" stroke="black" stroke-width="3"/><text x="150" y="900" font-size="32">bee  butterfly  ladybug  ant  snail</text><text x="150" y="1000" font-size="30">Found: __________  Count: __________</text><text x="150" y="1200" font-size="30">My creature: __________________________</text></svg>