<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">02-我的美味早餐</text><text x="70" y="160" font-size="30">遊戲目的</text><text x="70" y="210" font-size="24">認識食物分類、培養生活規劃</text><text x="650" y="160" font-size="30">材料</text><text x="650" y="210" font-size="24">列印本頁、剪刀、膠水、色筆</text><text x="70" y="300" font-size="30">玩法步驟</text><text x="70" y="350" font-size="24">1. 剪下食物卡。</text><text x="70" y="395" font-size="24">2. 選出早餐食物。</text><text x="70" y="440" font-size="24">3. 貼到早餐餐盤。</text><text x="70" y="485" font-size="24">4. 一起幫早餐取名字。</text><text x="70" y="590" font-size="28">7歲：設計早餐組合、說明理由</text><text x="650" y="590" font-size="28">3歲：挑選食物、貼到餐盤</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">可直接列印使用的紙本素材</text><ellipse cx="620" cy="1030" rx="350" ry="220" fill="none" stroke="black" stroke-width="5"/><text x="510" y="1040" font-size="34">我的早餐餐盤</text><text x="90" y="1380" font-size="28">食物卡：吐司　雞蛋　牛奶　香蕉　蘋果　起司　番茄　生菜</text></svg>