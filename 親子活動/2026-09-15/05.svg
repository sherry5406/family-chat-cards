<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">05 Super Memory Flip</text><text x="70" y="160" font-size="30">Purpose</text><text x="70" y="210" font-size="24">Practice memory, observation, and turn taking.</text><text x="650" y="160" font-size="30">Materials</text><text x="650" y="210" font-size="24">Printed page, scissors, optional thick paper.</text><text x="70" y="300" font-size="30">Steps</text><text x="70" y="350" font-size="24">1. Cut out the cards.</text><text x="70" y="395" font-size="24">2. Put them face down.</text><text x="70" y="440" font-size="24">3. Take turns flipping two cards.</text><text x="70" y="485" font-size="24">4. Keep matching pairs and count them.</text><text x="70" y="590" font-size="28">Age 7: remember positions and keep score.</text><text x="650" y="590" font-size="28">Age 3: flip cards and find a match.</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">Printable cards</text><text x="120" y="900" font-size="32">STAR   STAR    HEART   HEART</text><text x="120" y="1040" font-size="32">SUN    SUN     CAR     CAR</text><text x="120" y="1180" font-size="32">FLOWER FLOWER  APPLE   APPLE</text></svg>