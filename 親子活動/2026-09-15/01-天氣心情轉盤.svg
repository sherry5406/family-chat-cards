<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">01-天氣心情轉盤</text><text x="70" y="160" font-size="30">遊戲目的</text><text x="70" y="210" font-size="24">認識天氣與情緒、練習表達</text><text x="650" y="160" font-size="30">材料</text><text x="650" y="210" font-size="24">列印本頁、剪刀、迴紋針、色筆</text><text x="70" y="300" font-size="30">玩法步驟</text><text x="70" y="350" font-size="24">1. 剪下兩個轉盤。</text><text x="70" y="395" font-size="24">2. 用迴紋針固定中心。</text><text x="70" y="440" font-size="24">3. 轉一轉，說今天的天氣和心情。</text><text x="70" y="485" font-size="24">4. 互相分享：為什麼會有這種心情？</text><text x="70" y="590" font-size="28">7歲：設計轉盤、記錄觀察</text><text x="650" y="590" font-size="28">3歲：剪下轉盤、轉動、說出圖案</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">可直接列印使用的紙本素材</text><circle cx="350" cy="1040" r="250" fill="none" stroke="black" stroke-width="3"/><line x1="350" y1="790" x2="350" y2="1290" stroke="black"/><line x1="100" y1="1040" x2="600" y2="1040" stroke="black"/><text x="270" y="850" font-size="28">晴</text><text x="270" y="1260" font-size="28">雨</text><text x="120" y="1050" font-size="28">風</text><text x="530" y="1050" font-size="28">多雲</text><circle cx="850" cy="1040" r="250" fill="none" stroke="black" stroke-width="3"/><line x1="850" y1="790" x2="850" y2="1290" stroke="black"/><line x1="600" y1="1040" x2="1100" y2="1040" stroke="black"/><text x="790" y="850" font-size="28">開心</text><text x="790" y="1260" font-size="28">難過</text><text x="620" y="1050" font-size="28">生氣</text><text x="1030" y="1050" font-size="28">驚訝</text><circle cx="1180" cy="1685" r="6" fill="black"/><text x="620" y="1650" text-anchor="middle" font-size="18">2026-09-15</text></svg>