<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">06 Castle Builder</text><text x="70" y="160" font-size="30">Purpose</text><text x="70" y="210" font-size="24">Use imagination and practice spatial planning.</text><text x="650" y="160" font-size="30">Materials</text><text x="650" y="210" font-size="24">Printed page, scissors, tape or blocks, crayons.</text><text x="70" y="300" font-size="30">Steps</text><text x="70" y="350" font-size="24">1. Cut out the building pieces.</text><text x="70" y="395" font-size="24">2. Choose shapes to build a castle.</text><text x="70" y="440" font-size="24">3. Add a door, flag, and windows.</text><text x="70" y="485" font-size="24">4. Make up a short castle story.</text><text x="70" y="590" font-size="28">Age 7: plan structure, details, and story.</text><text x="650" y="590" font-size="28">Age 3: choose pieces, place, and color.</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">Printable building pieces</text><text x="130" y="900" font-size="36">RECTANGLE   SQUARE   TRIANGLE</text><text x="130" y="1030" font-size="36">CIRCLE      DOOR      FLAG</text><text x="130" y="1160" font-size="36">WINDOW      TOWER</text><text x="130" y="1320" font-size="30">Castle name: __________________________</text><!-- daily 2026-09-15 --></svg>