<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">06-城堡積木設計師</text><text x="70" y="160" font-size="30">遊戲目的</text><text x="70" y="210" font-size="24">發揮創意、練習空間規劃</text><text x="650" y="160" font-size="30">材料</text><text x="650" y="210" font-size="24">列印本頁、剪刀、膠帶或積木、色筆</text><text x="70" y="300" font-size="30">玩法步驟</text><text x="70" y="350" font-size="24">1. 剪下建築素材。</text><text x="70" y="395" font-size="24">2. 選形狀組成城堡。</text><text x="70" y="440" font-size="24">3. 加上門、旗子與窗戶。</text><text x="70" y="485" font-size="24">4. 一起編一個城堡故事。</text><text x="70" y="590" font-size="28">7歲：規劃結構、設計細節、講故事</text><text x="650" y="590" font-size="28">3歲：選素材、貼上、自由塗色</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">可直接列印使用的紙本素材</text><text x="130" y="900" font-size="36">長方形　正方形　三角形</text><text x="130" y="1030" font-size="36">圓形　門　旗子　窗戶</text><text x="130" y="1160" font-size="36">城堡名稱：________________</text><circle cx="1180" cy="1685" r="6" fill="black"/></svg>