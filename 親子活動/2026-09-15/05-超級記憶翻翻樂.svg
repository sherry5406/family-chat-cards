<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">05-超級記憶翻翻樂</text><text x="70" y="160" font-size="30">遊戲目的</text><text x="70" y="210" font-size="24">訓練記憶、觀察與輪流等待</text><text x="650" y="160" font-size="30">材料</text><text x="650" y="210" font-size="24">列印本頁、剪刀、厚紙板可選</text><text x="70" y="300" font-size="30">玩法步驟</text><text x="70" y="350" font-size="24">1. 剪下圖卡。</text><text x="70" y="395" font-size="24">2. 背面朝上排好。</text><text x="70" y="440" font-size="24">3. 輪流翻兩張找相同圖案。</text><text x="70" y="485" font-size="24">4. 找到一對就保留，最後數一數。</text><text x="70" y="590" font-size="28">7歲：記住位置、制定策略、計分</text><text x="650" y="590" font-size="28">3歲：翻開圖卡、找相同圖案</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">可直接列印使用的紙本素材</text><text x="120" y="900" font-size="32">星星  星星  愛心  愛心</text><text x="120" y="1040" font-size="32">太陽  太陽  汽車  汽車</text><text x="120" y="1180" font-size="32">花朵  花朵  蘋果  蘋果</text><circle cx="1180" cy="1685" r="6" fill="black"/></svg>