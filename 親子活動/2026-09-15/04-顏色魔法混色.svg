<svg xmlns="http://www.w3.org/2000/svg" width="2480" height="3508" viewBox="0 0 1240 1754"><rect width="1240" height="1754" fill="white"/><text x="620" y="80" text-anchor="middle" font-size="48" font-weight="bold">04-顏色魔法混色</text><text x="70" y="160" font-size="30">遊戲目的</text><text x="70" y="210" font-size="24">理解基本混色、觀察變化</text><text x="650" y="160" font-size="30">材料</text><text x="650" y="210" font-size="24">列印本頁、彩筆或水彩、棉花棒</text><text x="70" y="300" font-size="30">玩法步驟</text><text x="70" y="350" font-size="24">1. 先完成混色圈。</text><text x="70" y="395" font-size="24">2. 觀察兩色重疊。</text><text x="70" y="440" font-size="24">3. 猜猜會變成什麼顏色。</text><text x="70" y="485" font-size="24">4. 試做另一組混色。</text><text x="70" y="590" font-size="28">7歲：記錄結果、比較不同組合</text><text x="650" y="590" font-size="28">3歲：塗色、觀察變化、說出顏色</text><rect x="60" y="680" width="1120" height="900" fill="none" stroke="black" stroke-width="3"/><text x="90" y="740" font-size="32" font-weight="bold">可直接列印使用的紙本素材</text><text x="130" y="900" font-size="30">紅＋黃＝○　藍＋黃＝○　紅＋藍＝○</text><text x="130" y="1050" font-size="30">我的新發現：________________________</text><circle cx="1180" cy="1685" r="6" fill="black"/></svg>