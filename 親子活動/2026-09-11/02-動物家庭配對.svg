<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><rect x="28" y="28" width="738" height="1067" rx="18" fill="none" stroke="black" stroke-width="3"/><text x="55" y="78" font-size="30" font-family="sans-serif" font-weight="bold">02-動物家庭配對</text><text x="55" y="125" font-size="20" font-family="sans-serif" font-weight="bold">遊戲目的</text><text x="55" y="153" font-size="17" font-family="sans-serif">觀察動物特徵，把爸爸、媽媽、寶寶分到同一家。</text><text x="55" y="205" font-size="20" font-family="sans-serif" font-weight="bold">材料</text><text x="55" y="233" font-size="17" font-family="sans-serif">列印圖卡、剪刀、膠水</text><text x="55" y="285" font-size="20" font-family="sans-serif" font-weight="bold">玩法步驟</text><text x="65" y="320" font-size="17" font-family="sans-serif">1. 剪下動物卡。</text><text x="65" y="362" font-size="17" font-family="sans-serif">2. 找出相同動物。</text><text x="65" y="404" font-size="17" font-family="sans-serif">3. 放進爸爸媽媽寶寶欄。</text><text x="65" y="446" font-size="17" font-family="sans-serif">4. 一起說出動物名稱。</text><text x="55" y="510" font-size="20" font-family="sans-serif" font-weight="bold">7歲孩子負責</text><text x="65" y="540" font-size="17" font-family="sans-serif">設計規則、示範玩法、計數或記錄結果。</text><text x="55" y="585" font-size="20" font-family="sans-serif" font-weight="bold">3歲孩子負責</text><text x="65" y="615" font-size="17" font-family="sans-serif">操作素材、觀察、配對、塗色或說出答案。</text><text x="55" y="675" font-size="20" font-family="sans-serif" font-weight="bold">紙本素材</text><rect x="55" y="710" width="200" height="115" rx="10" fill="white" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><text x="155" y="772" text-anchor="middle" font-size="18" font-family="sans-serif">剪下／記錄</text><rect x="285" y="710" width="200" height="115" rx="10" fill="white" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><text x="385" y="772" text-anchor="middle" font-size="18" font-family="sans-serif">剪下／記錄</text><rect x="515" y="710" width="200" height="115" rx="10" fill="white" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><text x="615" y="772" text-anchor="middle" font-size="18" font-family="sans-serif">剪下／記錄</text></svg>