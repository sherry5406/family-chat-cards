<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><rect x="28" y="28" width="738" height="1067" rx="18" fill="none" stroke="black" stroke-width="3"/><text x="55" y="78" font-size="30" font-family="sans-serif" font-weight="bold">03-形狀尋寶地圖</text><text x="55" y="125" font-size="20" font-family="sans-serif" font-weight="bold">遊戲目的</text><text x="55" y="153" font-size="17" font-family="sans-serif">在家中尋找圓形、三角形、正方形等形狀。</text><text x="55" y="205" font-size="20" font-family="sans-serif" font-weight="bold">材料</text><text x="55" y="233" font-size="17" font-family="sans-serif">學習單、鉛筆、家中物品</text><text x="55" y="285" font-size="20" font-family="sans-serif" font-weight="bold">玩法步驟</text><text x="65" y="320" font-size="17" font-family="sans-serif">1. 看形狀提示。</text><text x="65" y="362" font-size="17" font-family="sans-serif">2. 在家裡找物品。</text><text x="65" y="404" font-size="17" font-family="sans-serif">3. 畫下或記錄找到的物品。</text><text x="65" y="446" font-size="17" font-family="sans-serif">4. 比比看誰找到最多。</text><text x="55" y="510" font-size="20" font-family="sans-serif" font-weight="bold">7歲孩子負責</text><text x="65" y="540" font-size="17" font-family="sans-serif">設計規則、示範玩法、計數或記錄結果。</text><text x="55" y="585" font-size="20" font-family="sans-serif" font-weight="bold">3歲孩子負責</text><text x="65" y="615" font-size="17" font-family="sans-serif">操作素材、觀察、配對、塗色或說出答案。</text><text x="55" y="675" font-size="20" font-family="sans-serif" font-weight="bold">紙本素材</text><rect x="55" y="710" width="200" height="115" rx="10" fill="white" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><text x="155" y="772" text-anchor="middle" font-size="18" font-family="sans-serif">剪下／記錄</text><rect x="285" y="710" width="200" height="115" rx="10" fill="white" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><text x="385" y="772" text-anchor="middle" font-size="18" font-family="sans-serif">剪下／記錄</text><rect x="515" y="710" width="200" height="115" rx="10" fill="white" stroke="black" stroke-width="2" stroke-dasharray="7 5"/><text x="615" y="772" text-anchor="middle" font-size="18" font-family="sans-serif">剪下／記錄</text></svg>