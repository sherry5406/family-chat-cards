<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 794 1123"><rect width="794" height="1123" fill="white"/><rect x="28" y="28" width="738" height="1067" rx="18" fill="none" stroke="black" stroke-width="3"/><text x="55" y="78" font-size="30" font-family="sans-serif" font-weight="bold">05-對稱圖形畫畫</text><text x="55" y="125" font-size="20" font-family="sans-serif" font-weight="bold">遊戲目的</text><text x="55" y="153" font-size="17" font-family="sans-serif">補上另一半圖形，練習觀察左右對稱。</text><text x="55" y="205" font-size="20" font-family="sans-serif" font-weight="bold">材料</text><text x="55" y="233" font-size="17" font-family="sans-serif">學習單、鉛筆、蠟筆</text><text x="55" y="285" font-size="20" font-family="sans-serif" font-weight="bold">玩法步驟</text><text x="65" y="320" font-size="17" font-family="sans-serif">1. 看左半邊圖形。</text><text x="65" y="362" font-size="17" font-family="sans-serif">2. 找出對稱位置。</text><text x="65" y="404" font-size="17" font-family="sans-serif">3. 畫出另一半。</text><text x="65" y="446" font-size="17" font-family="sans-serif">4. 完成後自由上色。</text><text x="55" y="510" font-size="20" font-family="sans-serif" font-weight="bold">7歲孩子負責</text><text x="65" y="540" font-size="17" font-family="sans-serif">設計規則、示範玩法、計數或記錄結果。</text><text x="55" y="585" font-size="20" font-family="sans-serif" font-weight="bold">3歲孩子負責</text><text x="65" y="615" font-size="17" font-family="sans-serif">觀察、塗色、描線與完成圖形。</text><text x="55" y="675" font-size="20" font-family="sans-serif" font-weight="bold">紙本素材</text><rect x="55" y="710" width="200" height="180" fill="white" stroke="black" stroke-width="2"/><line x1="155" y1="710" x2="155" y2="890" stroke="black" stroke-width="2" stroke-dasharray="6 5"/><path d="M155 745 C100 745 90 805 155 850" fill="none" stroke="black" stroke-width="3"/><text x="385" y="800" text-anchor="middle" font-size="18" font-family="sans-serif">請補上右半邊</text></svg>